<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title if title else "Graphify Second Brain" }}</title>
  <link rel="stylesheet" href="/static/style.css?v=obsidian">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <a class="brand" href="/">Graphify Second Brain</a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Wiki</a>
        <a href="/sources" class="{% if request.url.path.startswith('/sources') %}active{% endif %}">Sources</a>
      </nav>
      <p class="subtitle">Markdown vault generated from a Graphify knowledge graph.</p>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
